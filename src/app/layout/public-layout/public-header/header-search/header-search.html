<ng-container>

    <search-icon 
    [color]="colorSwap()"
    [size]="24"
    (onClick)="openSearch()"
    />

    @if ( isSearchOpen() ) {
        <div class="search_modal">

            <div class="search_modal_box">
                <div class="search_input_wrap">
    
                    <left-arrow 
                    color="light"
                    [size]="33"
                    (onClick)="closeSearch()"
                    />
                    
                    <input 
                    type="text"
                    placeholder="Search tours..."
                    #headerSearch
                    class="search_input"
                    [formControl]="form"
                    />
    
                </div>
                <div class="search_result_wrap">
                    @if ( tourTitles$ | async; as tourTitles ) {
                            @for ( tour of tourTitles; let i = $index; track i ) {
                            <button class="search_result" 
                            [class.active]="activeBar() === i"
                            (mouseenter)="activeBar.set(i)"
                            >
                                <span>
                                    {{ tour.title | titlecase }}
                                </span>
                            </button>
                        }@empty {
                            <span class="no-result">
                                No result!
                            </span>
                        }
                    }
                </div>
            </div>
    
        </div>
    }

</ng-container>
